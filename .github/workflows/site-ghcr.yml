# Build site/ (Next standalone) and push to GHCR for Dokploy Provider Docker.
# Image: ghcr.io/forge-digitale-solutions/medoc-vibes-site
# After push: POST Dokploy deploy webhook (secret DOKPLOY_SITE_DEPLOY_WEBHOOK).
# Public HTTPS Dokploy URL — no Tailscale join required on GitHub-hosted runners.
name: Site GHCR

on:
  push:
    branches: [dev, main]
    paths:
      - "site/**"
      - ".github/workflows/site-ghcr.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: forge-digitale-solutions/medoc-vibes-site

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # GHA layer cache (cache-from/to type=gha)
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
            type=sha,prefix=,format=short
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./site
          file: ./site/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-dokploy:
    name: Notify Dokploy
    needs: build-and-push
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
    steps:
      - name: Trigger Dokploy site deploy webhook
        env:
          DOKPLOY_SITE_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_SITE_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_SITE_DEPLOY_WEBHOOK:-}" ]; then
            echo "::error::Missing secret DOKPLOY_SITE_DEPLOY_WEBHOOK (full public Dokploy deploy URL)"
            exit 1
          fi

          # Do not echo the URL or response body (may contain tokens).
          http_code="$(curl --silent --show-error --output /tmp/dokploy-webhook.out \
            --write-out '%{http_code}' --max-time 60 \
            -X POST \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "${DOKPLOY_SITE_DEPLOY_WEBHOOK}")"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Dokploy deploy webhook failed with HTTP ${http_code}"
            exit 1
          fi
          echo "Dokploy deploy webhook accepted (HTTP ${http_code})"
